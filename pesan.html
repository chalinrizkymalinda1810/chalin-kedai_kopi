<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kedai Kopi — Pesan</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
      <div class="container">
        <div class="nav-inner">
          <a href="index.html" class="nav-logo">
            <img src="img/kedai-kopi.jpg" alt="Logo Kedai Kopi — Rasa yang Tak Terlupakan">
          </a>
          <nav aria-label="Navigasi utama">
            <ul class="nav-links">
              <li><a href="index.html">Beranda</a></li>
              <li><a href="menu.html">Menu</a></li>
              <li><a href="pesan.html" aria-current="page">Pesan</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <section class="pesan-section" aria-labelledby="pesan-heading">
        <div class="container">
          <div class="pesan-inner">

            <!-- ===== LEFT DECORATIVE COLUMN ===== -->
            <div class="pesan-left">
              <h1 id="pesan-heading" class="pesan-left-title">Pesan Sekarang</h1>
              <p class="pesan-left-desc">Nikmati kopi favoritmu dengan mudah!</p>
              <img
                src="img/pesan-kopi.jpg"
                alt="Secangkir kopi hangat di atas tatakan kayu siap dinikmati"
                class="pesan-left-img"
              >
            </div>

            <!-- ===== RIGHT FORM COLUMN ===== -->
            <div class="pesan-right">
              <div class="form-card">
                <form action="pesan.html" method="get">

                  <div class="form-row">
                    <div class="form-group">
                      <label for="nama">Nama Pemesan</label>
                      <input
                        id="nama"
                        name="nama"
                        type="text"
                        placeholder="Masukkan nama Anda"
                        required
                        autocomplete="name"
                      >
                    </div>

                    <div class="form-group">
                      <label for="whatsapp">Nomor WhatsApp</label>
                      <input
                        id="whatsapp"
                        name="whatsapp"
                        type="tel"
                        placeholder="08xxxxxxxxxx"
                        required
                        autocomplete="tel"
                      >
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="menu">Pilihan Menu</label>
                    <select id="menu" name="menu" required>
                      <option value="" disabled selected>Pilih menu</option>
                      <option value="espresso">Espresso — Rp18.000</option>
                      <option value="americano">Americano — Rp22.000</option>
                      <option value="cappuccino">Cappuccino — Rp28.000</option>
                      <option value="matcha-latte">Matcha Latte — Rp30.000</option>
                      <option value="cokelat-hangat">Cokelat Hangat — Rp27.000</option>
                      <option value="lemon-tea">Lemon Tea — Rp20.000</option>
                    </select>
                  </div>

                  <div class="form-row">
                    <div class="form-group">
                      <label for="jumlah">Jumlah</label>
                      <input
                        id="jumlah"
                        name="jumlah"
                        type="number"
                        min="1"
                        max="10"
                        value="1"
                      >
                    </div>

                    <fieldset class="form-fieldset">
                      <legend>Cara Ambil</legend>
                      <div class="radio-group">
                        <label class="radio-label" for="ambil-di-tempat">
                          <input
                            id="ambil-di-tempat"
                            name="cara_ambil"
                            type="radio"
                            value="ambil-di-tempat"
                            checked
                          >
                          <span>Ambil di tempat</span>
                        </label>
                        <label class="radio-label" for="diantar">
                          <input
                            id="diantar"
                            name="cara_ambil"
                            type="radio"
                            value="diantar"
                          >
                          <span>Diantar</span>
                        </label>
                      </div>
                    </fieldset>
                  </div>

                  <div class="form-group">
                    <label for="catatan">Catatan</label>
                    <textarea
                      id="catatan"
                      name="catatan"
                      rows="4"
                      placeholder="Tambahkan catatan (opsional)..."
                    ></textarea>
                  </div>

                  <button type="submit" class="btn-submit">Kirim Pesanan</button>

                </form>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
      <div class="container">
        <div class="footer-card">
          <svg class="footer-wave" viewBox="0 0 1000 72" preserveAspectRatio="none" aria-hidden="true">
            <path class="footer-wave-accent" fill="currentColor" d="M0,44 C120,10 260,16 380,38 C520,62 680,58 840,26 C920,10 968,14 1000,26 L1000,72 L0,72 Z"/>
            <path fill="currentColor" d="M0,34 C110,12 230,12 360,34 C510,58 640,54 810,22 C900,6 960,8 1000,18 L1000,72 L0,72 Z"/>
          </svg>
          <div class="footer-body">
            <div class="footer-inner">
              <div class="footer-brand">
                <img src="img/kedai-kopi.jpg" alt="Logo Kedai Kopi" class="footer-logo-img">
              </div>

              <div class="footer-divider" role="separator"></div>

              <div class="footer-social">
                <h3>Ikuti Kami</h3>
                <div class="social-icons">
                  <span class="social-icon" role="img" aria-label="Instagram Kedai Kopi">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <rect x="3" y="3" width="18" height="18" rx="5"/>
                      <circle cx="12" cy="12" r="4"/>
                      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
                    </svg>
                  </span>
                  <span class="social-icon" role="img" aria-label="TikTok Kedai Kopi">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-2.88-2.88c.3 0 .6.04.88.12V9.4a6.33 6.33 0 0 0-.88-.06A6.34 6.34 0 0 0 3.15 15.7a6.34 6.34 0 0 0 10.82 4.48 6.28 6.28 0 0 0 1.85-4.48V8.7a8.18 8.18 0 0 0 4.77 1.52V6.78c-.34 0-.67-.03-1-.09Z"/>
                    </svg>
                  </span>
                  <span class="social-icon" role="img" aria-label="YouTube Kedai Kopi">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M21.58 7.19a2.75 2.75 0 0 0-1.94-1.95C17.93 4.75 12 4.75 12 4.75s-5.93 0-7.64.49a2.75 2.75 0 0 0-1.94 1.95A28.7 28.7 0 0 0 2 12a28.7 28.7 0 0 0 .42 4.81 2.75 2.75 0 0 0 1.94 1.95c1.71.49 7.64.49 7.64.49s5.93 0 7.64-.49a2.75 2.75 0 0 0 1.94-1.95A28.7 28.7 0 0 0 22 12a28.7 28.7 0 0 0-.42-4.81ZM10 15.2V8.8l5.5 3.2-5.5 3.2Z"/>
                    </svg>
                  </span>
                </div>
              </div>

              <div class="footer-tagline-box">
                <div class="footer-tagline-wrap">
                  <span>Rasa yang Tak Terlupakan</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 21s-7-4.35-9.33-8.36C1.14 9.99 2.4 6.2 5.9 5.3A5.3 5.3 0 0 1 12 7.5a5.3 5.3 0 0 1 6.1-2.2c3.5.9 4.76 4.69 3.23 7.34C19 16.65 12 21 12 21z"/>
                  </svg>
                </div>
                <svg class="footer-swash" viewBox="0 0 160 12" fill="none" aria-hidden="true">
                  <path d="M4 9 C52 2, 108 2, 156 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </div>
            </div>

            <p class="footer-copy">&copy; 2025 Kedai Kopi &middot; Jl. Melati No. 17, Bandung</p>
          </div>
        </div>
      </div>
    </footer>

  </body>
</html>
